use_default_settings: true

general:
  debug: false
  instance_name: "Tide Search"

search:
  safe_search: 0
  default_lang: "zh-CN"
  formats:
    - html
    - json
    - rss

server:
  secret_key: "ultrasecretkey"
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
