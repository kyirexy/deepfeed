name: Verify minute live deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-minute-deployment.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify dashboard and health endpoint
        env:
          BASE_URL: https://tide-public-opinion-minute-kyirexys-projects.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ['BASE_URL'].rstrip('/')
          last_error = None
          for attempt in range(1, 25):
              try:
                  request = urllib.request.Request(base + '/', headers={'User-Agent': 'TidePublicVerifier/1.0'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      html = response.read().decode('utf-8', 'replace')
                      assert response.status == 200
                      assert '正在加载分钟级真实舆情工作台' in html or '潮汐' in html
                  request = urllib.request.Request(base + '/api/health?t=' + str(time.time()), headers={'User-Agent': 'TidePublicVerifier/1.0'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                      assert response.status == 200
                      assert payload.get('mock') is False
                      assert payload.get('minuteArchive') is True
                      assert payload.get('ok') is True
                  print(json.dumps({'verified': True, 'attempt': attempt, 'baseUrl': base, 'health': payload}, ensure_ascii=False))
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = f'{type(exc).__name__}: {exc}'
                  print(f'attempt {attempt}: {last_error}')
                  time.sleep(10)
          raise SystemExit('verification failed: ' + str(last_error))
          PY
