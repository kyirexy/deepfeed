name: Verify live deployment

on:
  push:
    branches: [main]
    paths:
      - "collector/verify_deployment.py"
      - ".github/workflows/verify-live-deployment.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-live-deployment
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify public deployment
        run: python collector/verify_deployment.py

      - name: Commit verification evidence
        if: always()
        run: |
          if [ ! -f data/deployment-health.json ]; then
            exit 0
          fi
          git config user.name "deepfeed-bot"
          git config user.email "deepfeed-bot@users.noreply.github.com"
          git add data/deployment-health.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: update deployment verification evidence"
          git push
