name: Collect open-source platform search

on:
  workflow_dispatch:
  push:
    paths:
      - "opensource-search/**"
      - ".github/workflows/collect-open-source-stack-v2.yml"
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: write

concurrency:
  group: deepfeed-public-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Start ephemeral SearXNG
        run: |
          mkdir -p /tmp/searxng
          cp opensource-search/searxng-settings.yml /tmp/searxng/settings.yml
          docker run -d --name searxng \
            -p 8080:8080 \
            -v /tmp/searxng/settings.yml:/etc/searxng/settings.yml:ro \
            searxng/searxng:latest
          for i in $(seq 1 40); do
            if curl -fsS 'http://127.0.0.1:8080/search?q=health&format=json' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs searxng
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: opensource-search/requirements.txt

      - name: Install collector dependencies
        run: pip install -r opensource-search/requirements.txt

      - name: Collect public indexed results
        env:
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          DEEPFEED_CONFIG: opensource-search/config.json
          DEEPFEED_OUTPUT: data/live.json
        run: python opensource-search/collect.py

      - name: Verify real-data contract
        run: |
          python - <<'PY'
          import json
          payload = json.load(open("data/live.json", encoding="utf-8"))
          assert payload["mock"] is False
          assert isinstance(payload["items"], list)
          assert isinstance(payload["sources"], list)
          assert payload["collection"]["noLogin"] is True
          assert payload["collection"]["noBypass"] is True
          print({
              "mock": payload["mock"],
              "itemCount": payload["itemCount"],
              "acceptedThisRun": payload["acceptedThisRun"],
              "generatedAt": payload["generatedAt"],
          })
          PY

      - name: Persist archive
        run: |
          git config user.name "deepfeed-bot"
          git config user.email "deepfeed-bot@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then
            echo "No archive change."
          else
            git commit -m "data: refresh open-source platform search"
            git push
          fi
