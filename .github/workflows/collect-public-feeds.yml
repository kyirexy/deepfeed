name: Collect public opinion feeds

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collect-public-feeds.yml"

permissions:
  contents: write

concurrency:
  group: public-feed-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public RSS results
        run: python collector/collect.py

      - name: Commit archive update
        run: |
          if git diff --quiet -- data/live.json; then
            echo "No archive changes"
            exit 0
          fi
          git config user.name "deepfeed-bot"
          git config user.email "deepfeed-bot@users.noreply.github.com"
          git add data/live.json
          git commit -m "data: refresh public feed archive"
          git push
