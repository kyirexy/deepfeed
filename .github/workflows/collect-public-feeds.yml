name: Collect public opinion feeds

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'config/**'
      - 'infra/searxng/**'
      - '.github/workflows/collect-public-feeds.yml'
      - 'bundle/**'

permissions:
  contents: write

concurrency:
  group: public-opinion-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install bundled source update
        if: ${{ hashFiles('bundle/install.py') != '' }}
        run: python bundle/install.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start open-source discovery services
        env:
          SEARXNG_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-tide
        run: |
          set +e
          sed "s|ultrasecretkey|$SEARXNG_SECRET|g" infra/searxng/settings.yml > /tmp/tide-searxng-settings.yml
          docker run --rm -d --name tide-searxng \
            -p 127.0.0.1:8080:8080 \
            -v "/tmp/tide-searxng-settings.yml:/etc/searxng/settings.yml:ro" \
            searxng/searxng:latest

          docker run --rm -d --name tide-rsshub \
            -p 127.0.0.1:1200:1200 \
            -e REQUEST_RETRY=2 \
            diygod/rsshub:latest

          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 2
          done
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:1200/healthz >/dev/null && break
            sleep 2
          done
          set -e

      - name: Collect public discovery records
        env:
          SEARXNG_URL: http://127.0.0.1:8080
          RSSHUB_URL: http://127.0.0.1:1200
          SEARCH_TIME_RANGE: month
          MAX_QUERIES_PER_PLATFORM: '2'
        run: python collector/collect_public_opinion.py

      - name: Validate non-mock archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/live.json')
          data = json.loads(p.read_text('utf-8'))
          assert data.get('mock') is False, 'mock:false validation failed'
          assert data.get('schemaVersion') == 2, 'unexpected schema version'
          assert isinstance(data.get('sources'), list), 'sources missing'
          assert isinstance(data.get('items'), list), 'items missing'
          print({
              'ok': data.get('ok'),
              'items': len(data['items']),
              'providerSuccess': data.get('stats', {}).get('providerSuccess'),
              'providerFailure': data.get('stats', {}).get('providerFailure'),
          })
          PY

      - name: Commit updated archive
        run: |
          git config user.name "tide-collector[bot]"
          git config user.email "tide-collector[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: install and refresh open-source discovery"
          git push

      - name: Provider diagnostics
        if: always()
        run: |
          docker logs --tail 80 tide-searxng 2>/dev/null || true
          docker logs --tail 80 tide-rsshub 2>/dev/null || true
